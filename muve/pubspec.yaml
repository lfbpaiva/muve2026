name: muve
description: "Muve - Conecta músicos e contratantes locais"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animate_do: ^3.3.4
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/muvelogo.png
    - assets/images/images_contrante_events_screen/
    - assets/images/images_events_screen/
    - assets/images/images_events_screen/images_events_sertanejo/
